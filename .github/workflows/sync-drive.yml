name: Sync Music Archive

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read Google Drive and metadata sheet
        run: pnpm run sync:drive
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          MUSIC_METADATA_SHEET_ID: ${{ vars.MUSIC_METADATA_SHEET_ID }}
      - run: pnpm test
        env:
          VITE_GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
      - name: Commit changed archive index
        run: |
          if git diff --quiet -- app/data/archive.generated.json; then exit 0; fi
          git config user.name "music-archive-bot"
          git config user.email "music-archive-bot@users.noreply.github.com"
          git add app/data/archive.generated.json
          git commit -m "chore: sync music archive"
          git push
